name: Hourly Logistics BI Tracker & Web Update

on:
  schedule:
    # รันอัตโนมัติทุกต้นชั่วโมง
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      partition_day1:
        description: 'วันที่เริ่มต้น Partition_Day1 (รูปแบบ YYYYMMDD เช่น 20260929 หรือเว้นว่างเพื่อใช้วันนี้)'
        required: false
        default: ''
      partition_day2:
        description: 'วันที่สิ้นสุด Partition_Day2 (รูปแบบ YYYYMMDD เช่น 20260929 หรือเว้นว่างเพื่อใช้วันนี้)'
        required: false
        default: ''
      report_time:
        description: 'ตัวกรองเวลา Report_time_Choose_lasted_time (เช่น 7 หรือ [7] หรือเว้นว่างเพื่อใช้ชั่วโมงปัจจุบัน)'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  track-and-update-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pytz

      - name: Run Tracker Script
        env:
          BI_ACCESS_TOKEN: ${{ secrets.BI_ACCESS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          INPUT_DAY1: ${{ github.event.inputs.partition_day1 }}
          INPUT_DAY2: ${{ github.event.inputs.partition_day2 }}
          INPUT_REPORT_TIME: ${{ github.event.inputs.report_time }}
        run: |
          python tracker.py

      - name: Commit and Push Latest Web Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update logistics data [skip ci]" && git push)
