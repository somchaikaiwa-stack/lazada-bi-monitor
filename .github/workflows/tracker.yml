name: Hourly Logistics BI Tracker & Web Update

on:
  schedule:
    # รันทุกต้นชั่วโมง (ตามเวลา UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-and-update-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pytz

      - name: Run Tracker Script
        env:
          BI_ACCESS_TOKEN: ${{ secrets.BI_ACCESS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python tracker.py

      - name: Commit and Push Latest Web Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update logistics data [skip ci]" && git push)
