name: Hourly Logistics BI Tracker & Web Update

on:
  schedule:
    - cron: '45 2-15 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'เลือกโหมดการทำงาน (Mode)'
        required: true
        default: 'auto_hourly'
        type: choice
        options:
          - 'auto_hourly'          # รันอัตโนมัติประจำชั่วโมง (09:00 - 22:00)
          - 'manual_custom'        # ระบุวันที่และรอบเวลาที่ต้องการทดสอบเอง
          - 'test_bot_only'        # ทดสอบส่งข้อความเข้า DingTalk
          - 'test_full_flow'       # ทดสอบดึงข้อมูลรอบปัจจุบันทันที
      custom_day1:
        description: '[เฉพาะ manual_custom] วันที่เริ่มต้น (เช่น วันนี้ หรือระบุ YYYYMMDD)'
        required: false
        default: ''
      custom_day2:
        description: '[เฉพาะ manual_custom] วันที่สิ้นสุด (ถ้าวันเดียว ไม่ต้องกรอก)'
        required: false
        default: ''
      custom_hour:
        description: '[เฉพาะ manual_custom] เลือกรอบเวลา (เช่น 7, 8, 9, 10 ... 22)'
        required: false
        default: '9'

permissions:
  contents: write

jobs:
  track-and-update-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pytz

      - name: Run Tracker Script
        env:
          BI_ACCESS_TOKEN: ${{ secrets.BI_ACCESS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'auto_hourly' }}
          CUSTOM_DAY1: ${{ github.event.inputs.custom_day1 }}
          CUSTOM_DAY2: ${{ github.event.inputs.custom_day2 }}
          CUSTOM_HOUR: ${{ github.event.inputs.custom_hour }}
        run: |
          python tracker.py

      - name: Commit and Push Latest Web Data & History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "data/latest.json" ] && git add data/latest.json
          [ -f "data/daily_history.json" ] && git add data/daily_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update logistics data & daily log [skip ci]" && git push)
