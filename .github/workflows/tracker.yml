name: Hourly Logistics BI Tracker & Web Update

on:
  schedule:
    # 02:45 - 15:45 UTC = 09:45 - 22:45 เวลาไทย (UTC+7)
    - cron: '45 2-15 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'เลือกโหมดการทำงาน'
        required: true
        default: 'auto_hourly'
        type: choice
        options:
          - 'auto_hourly'
          - 'test_bot_only'
          - 'test_full_flow'
          - 'manual_custom'
      custom_day1:
        description: '[เฉพาะโหมด manual_custom] วันที่เริ่มต้น (YYYYMMDD)'
        required: false
        default: ''
      custom_day2:
        description: '[เฉพาะโหมด manual_custom] วันที่สิ้นสุด (YYYYMMDD)'
        required: false
        default: ''
      custom_hour:
        description: '[เฉพาะโหมด manual_custom] รอบเวลา (เช่น 7, 8, 22)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  track-and-update-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pytz

      - name: Run Tracker Script
        env:
          BI_ACCESS_TOKEN: ${{ secrets.BI_ACCESS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'auto_hourly' }}
          CUSTOM_DAY1: ${{ github.event.inputs.custom_day1 }}
          CUSTOM_DAY2: ${{ github.event.inputs.custom_day2 }}
          CUSTOM_HOUR: ${{ github.event.inputs.custom_hour }}
        run: |
          python tracker.py

      - name: Commit and Push Latest Web Data & History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ตรวจสอบว่ามีไฟล์ไหนอยู่บ้าง ค่อยสั่ง add ป้องกัน Error 128
          [ -f "data/latest.json" ] && git add data/latest.json
          [ -f "data/daily_history.json" ] && git add data/daily_history.json
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update logistics data & daily log [skip ci]" && git push)
